name: Offline CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check --timeout 15 --retries 0 .
      - run: python -m unittest discover -s tests -v
      - run: yugioh-benchmark inspect replays/db-text-aco77-sdesowitz02-2026-10-07
      - run: yugioh-benchmark inspect replays/db-json-40753-85958923
  harness-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SeucheAchat9115/yugioh-harness
          ref: 1d54835a8e239160f8e5dc4f01c8589506669ac0
          path: harness-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test bridge against pinned public harness
        env:
          PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/harness-source'
        run: python -m unittest discover -s tests -v
      - name: Reproduce recorded operations with pinned harness
        env:
          PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/harness-source'
        run: python -m yugioh_benchmark reproduce replays/db-text-aco77-sdesowitz02-2026-10-07 --output runs/reproduction.json
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --timeout 15 --retries 0 build
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: yugioh-benchmark inspect replays/db-text-aco77-sdesowitz02-2026-10-07
      - run: yugioh-benchmark inspect replays/db-json-40753-85958923
