name: Offline CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check --timeout 15 --retries 0 .
      - run: python -m unittest discover -s tests -v
      - run: yugioh-benchmark inspect replays/db-2178594
  harness-compatibility:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SeucheAchat9115/yugioh-harness
          ref: 1d54835a8e239160f8e5dc4f01c8589506669ac0
          path: harness-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bridge against pinned harness
        env:
          PYTHONPATH: '${{ github.workspace }}/src;${{ github.workspace }}/harness-source'
        run: python -m unittest discover -s tests -v

