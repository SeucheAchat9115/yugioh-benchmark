name: Inspect public DuelingBook replay
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-replay.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve public page and replay loader with bounded requests
        shell: python
        run: |
          import json, re, urllib.request, urllib.parse, time
          from pathlib import Path
          root=Path('inspection'); root.mkdir()
          started=time.monotonic()
          def fetch(url, filename):
              if time.monotonic()-started > 100: raise RuntimeError('Inspection deadline exceeded')
              with urllib.request.urlopen(url,timeout=8) as response:
                  data=response.read(12*1024*1024+1)
              if len(data)>12*1024*1024: raise RuntimeError('Source too large')
              (root/filename).write_bytes(data)
              return data.decode('utf-8',errors='replace')
          page=fetch('https://www.duelingbook.com/replay?id=678633-59711433','replay.html')
          scripts=re.findall(r'<script[^>]+src=[\"\x27]([^\"\x27]+)',page,re.I)
          print('Script sources:',json.dumps(scripts))
          inventory=[]
          for index,src in enumerate(src for src in scripts if "/duel.js" in src or "/utils.js" in src):
              url=urllib.parse.urljoin('https://www.duelingbook.com/',src)
              if urllib.parse.urlparse(url).hostname not in ('duelingbook.com','www.duelingbook.com','static.duelingbook.com'): continue
              filename=f'script-{index}.js'
              try:
                  source=fetch(url,filename)
                  inventory.append({'url':url,'file':filename})
                  for match in list(re.finditer(r'replay\.php|replay_data|replayData|loadReplay|replay_id|replay\.json|replay_file',source,re.I))[:12]:
                      print(filename,source[max(0,match.start()-140):match.end()+200].replace('\n',' '))
              except Exception as error: print('Fetch failed:',url,type(error).__name__,str(error))
          (root/'inventory.json').write_text(json.dumps(inventory,indent=2),encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-inspection
          path: inspection/
          retention-days: 1
